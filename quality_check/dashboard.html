<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Quality Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .dataset-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .dataset-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .dataset-title {
            font-size: 1.8rem;
            color: #333;
        }

        .dataset-badge {
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .badge-users {
            background: #667eea;
            color: white;
        }

        .badge-cards {
            background: #f093fb;
            color: white;
        }
        
        .badge-transactions {
            background: #4facfe;
            color: white;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .metric-label {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
        }

        .section-title {
            font-size: 1.3rem;
            color: #333;
            margin: 25px 0 15px 0;
            padding-left: 10px;
            border-left: 4px solid #667eea;
        }

        .quality-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #f8f9fa;
        }

        .quality-label {
            font-weight: 500;
            color: #333;
        }

        .quality-score {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .score-value {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-GREEN {
            background: #d4edda;
            color: #155724;
        }

        .status-YELLOW {
            background: #fff3cd;
            color: #856404;
        }

        .status-RED {
            background: #f8d7da;
            color: #721c24;
        }

        .issues-list {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .issue-item {
            padding: 8px 0;
            color: #856404;
        }

        .issue-item::before {
            content: "⚠ ";
            margin-right: 5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5rem;
            color: white;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #dc3545;
        }

        .timestamp {
            color: #666;
            font-size: 0.9rem;
            text-align: right;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Data Quality Dashboard</h1>
            <p>Real-time monitoring of banking datasets</p>
            <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>
        </div>

        <div id="dashboard"></div>
    </div>

    <script>
        function loadData() {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = '<div class="loading">Loading data...</div>';

            fetch('quality_results.json')
                .then(response => response.json())
                .then(data => {
                    renderDashboard(data);
                })
                .catch(error => {
                    dashboard.innerHTML = `<div class="error">Error loading data: ${error.message}</div>`;
                });
        }

        function renderDashboard(datasets) {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = '';

            datasets.forEach(dataset => {
                if (dataset.error) {
                    dashboard.innerHTML += `
                        <div class="dataset-card">
                            <div class="error">
                                <strong>Error:</strong> ${dataset.error}<br>
                                <strong>Dataset:</strong> ${dataset.dataset_name}
                            </div>
                        </div>
                    `;
                    return;
                }

                const card = document.createElement('div');
                card.className = 'dataset-card';
                
                let html = `
                    <div class="dataset-header">
                        <div class="dataset-title">${dataset.dataset_name}</div>
                        <div class="dataset-badge badge-${dataset.dataset_type}">
                            ${dataset.dataset_type}
                        </div>
                    </div>

                    <div class="metrics-grid">
                        <div class="metric-box">
                            <div class="metric-label">Total Records</div>
                            <div class="metric-value">${dataset.total_records.toLocaleString()}</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">Total Columns</div>
                            <div class="metric-value">${dataset.total_columns}</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">Issues Found</div>
                            <div class="metric-value">${dataset.issues.length}</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">Last Check</div>
                            <div class="metric-value" style="font-size: 1.2rem;">${dataset.timestamp}</div>
                        </div>
                    </div>
                `;

                // Completeness
                if (dataset.completeness && Object.keys(dataset.completeness).length > 0) {
                    html += '<div class="section-title">📊 Completeness</div>';
                    for (const [field, data] of Object.entries(dataset.completeness)) {
                        html += `
                            <div class="quality-item">
                                <span class="quality-label">${field}</span>
                                <div class="quality-score">
                                    <span class="score-value">${(data.score * 100).toFixed(2)}%</span>
                                    <span class="status-badge status-${data.status}">
                                        ${data.status}
                                    </span>
                                </div>
                            </div>
                        `;
                    }
                }

                // Uniqueness
                if (dataset.uniqueness && Object.keys(dataset.uniqueness).length > 0) {
                    html += '<div class="section-title">🔑 Uniqueness</div>';
                    for (const [field, data] of Object.entries(dataset.uniqueness)) {
                        html += `
                            <div class="quality-item">
                                <span class="quality-label">${field}</span>
                                <div class="quality-score">
                                    <span class="score-value">${(data.score * 100).toFixed(2)}%</span>
                                    <span class="status-badge status-${data.status}">
                                        ${data.status}
                                    </span>
                                </div>
                            </div>
                        `;
                    }
                }

                // Accuracy
                if (dataset.accuracy && Object.keys(dataset.accuracy).length > 0) {
                    html += '<div class="section-title">✅ Accuracy</div>';
                    for (const [field, data] of Object.entries(dataset.accuracy)) {
                        html += `
                            <div class="quality-item">
                                <span class="quality-label">${field}</span>
                                <div class="quality-score">
                                    <span class="score-value">${(data.score * 100).toFixed(2)}%</span>
                                    <span class="status-badge status-${data.status}">
                                        ${data.status}
                                    </span>
                                </div>
                            </div>
                        `;
                    }
                }

                // Timeliness
                if (dataset.timeliness && Object.keys(dataset.timeliness).length > 0) {
                    html += '<div class="section-title">⏰ Timeliness</div>';
                    for (const [field, data] of Object.entries(dataset.timeliness)) {
                        html += `
                            <div class="quality-item">
                                <span class="quality-label">${field}</span>
                                <div class="quality-score">
                                    <span class="score-value">${(data.score * 100).toFixed(2)}%</span>
                                    <span class="status-badge status-${data.status}">
                                        ${data.status}
                                    </span>
                                </div>
                            </div>
                        `;
                    }
                }

                // Consistency
                if (dataset.consistency && Object.keys(dataset.consistency).length > 0) {
                    html += '<div class="section-title">🔗 Consistency</div>';
                    for (const [field, data] of Object.entries(dataset.consistency)) {
                        html += `
                            <div class="quality-item">
                                <span class="quality-label">${field}</span>
                                <div class="quality-score">
                                    <span class="score-value">${(data.score * 100).toFixed(2)}%</span>
                                    <span class="status-badge status-${data.status}">
                                        ${data.status}
                                    </span>
                                </div>
                            </div>
                        `;
                    }
                }

                // Statistics
                if (dataset.statistics && Object.keys(dataset.statistics).length > 0) {
                    html += '<div class="section-title">📈 Statistics</div>';
                    html += '<div class="stats-grid">';
                    
                    for (const [key, value] of Object.entries(dataset.statistics)) {
                        if (typeof value === 'object') continue;
                        
                        let displayValue = value;
                        if (typeof value === 'number') {
                            if (key.includes('avg') || key.includes('income') || key.includes('debt')) {
                                displayValue = '$' + value.toLocaleString('en-US', {maximumFractionDigits: 0});
                            } else {
                                displayValue = value.toLocaleString('en-US', {maximumFractionDigits: 2});
                            }
                        }
                        
                        html += `
                            <div class="stat-card">
                                <div class="stat-label">${key.replace(/_/g, ' ').toUpperCase()}</div>
                                <div class="stat-value">${displayValue}</div>
                            </div>
                        `;
                    }
                    html += '</div>';
                }

                // Issues
                if (dataset.issues && dataset.issues.length > 0) {
                    html += '<div class="issues-list">';
                    html += '<strong style="font-size: 1.2rem;">⚠️ Issues Detected</strong>';
                    dataset.issues.forEach(issue => {
                        html += `<div class="issue-item">${issue}</div>`;
                    });
                    html += '</div>';
                }

                card.innerHTML = html;
                dashboard.appendChild(card);
            });
        }

        // Load data on page load
        window.onload = loadData;
    </script>
</body>
</html>
